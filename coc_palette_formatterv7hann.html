<!DOCTYPE html>
<html lang="ja">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoC7版チャットパレット整形ツール</title>

<!-- アップロードされたアイコンファイルを指定しました。 -->
<!-- このHTMLファイルと同じディレクトリに「coc_palette_formatterv7_icon.ico」を配置してください -->
<link rel="icon" href="coc_palette_formatterv7_icon.ico" type="image/x-icon">
<!-- ここまでファビコンの設定 -->
  
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<style>
body {
  font-family: 'Inter', sans-serif; /* Interフォントを使用 */
  margin: 0;
  background-color: #f0f4f8; /* ライトブルー系の背景色 */
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh; /* 画面いっぱいに広がるように */
  padding: 20px;
}
header {
  margin-bottom: 30px;
  text-align: center;
  padding: 20px;
  background-color: #ffffff;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
  width: 100%;
  max-width: 1000px;
}
header h1 {
  font-size: 2.5rem; /* 大きめのフォントサイズ */
  color: #2c3e50; /* ダークブルー */
  margin-bottom: 10px;
}
header p {
  font-size: 1rem;
  color: #555;
  line-height: 1.6;
}
.main {
  display: flex;
  flex-direction: column; /* スマートフォンでは縦並び */
  gap: 30px;
  max-width: 1000px;
  width: 100%;
}
@media (min-width: 768px) { /* デスクトップでは横並び */
  .main {
    flex-direction: row;
  }
}
.container {
  flex: 1;
  display: flex;
  flex-direction: column;
  background-color: #ffffff;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
}
textarea {
  width: 100%;
  height: 450px; /* 高さを調整 */
  resize: vertical; /* 縦方向のみリサイズ可能 */
  padding: 15px;
  font-family: 'Inter', monospace;
  font-size: 0.95rem;
  background-color: #f9f9f9;
  border: 1px solid #e0e0e0;
  border-radius: 8px;
  box-sizing: border-box;
  color: #333;
  line-height: 1.5;
  transition: border-color 0.3s ease-in-out;
}
textarea:focus {
  outline: none;
  border-color: #4a90e2; /* フォーカス時のボーダー色 */
  box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.2);
}
button {
  margin-top: 20px;
  padding: 12px 25px;
  font-size: 1.1rem;
  cursor: pointer;
  border: none;
  border-radius: 8px;
  background-color: #4a90e2; /* ブルー系のボタン色 */
  color: #fff;
  transition: background-color 0.3s ease-in-out, transform 0.2s ease-in-out;
  font-weight: 600;
  box-shadow: 0 4px 10px rgba(74, 144, 226, 0.3);
}
button:hover {
  background-color: #357ABD;
  transform: translateY(-2px);
  box-shadow: 0 6px 15px rgba(74, 144, 226, 0.4);
}
button:active {
  transform: translateY(0);
  box-shadow: 2px 5px rgba(74, 144, 226, 0.3);
}

/* メッセージボックスのスタイル */
.message-box {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background-color: #333;
    color: #fff;
    padding: 15px 30px;
    border-radius: 8px;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    z-index: 1000;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease-in-out, visibility 0.3s ease-in-out;
}
.message-box.show {
    opacity: 1;
    visibility: visible;
}
</style>
</head>
<body>

<header>
  <h1>CoC7版チャットパレット整形ツール</h1>
  <p>このツールは、CoC7版探索者のチャットパレットを自動分類し、初期値技能も加えた形でスッキリと整理します。<br>入力欄にチャットパレットを貼り付け、「分類して出力」ボタンで整形結果を表示します。</p>
</header>

<div class="main">
  <div class="container">
    <textarea id="input" placeholder="ここにチャットパレットを貼り付けてください"></textarea>
    <button onclick="formatPalette()">分類して出力</button>
  </div>

  <div class="container">
    <textarea id="output" readonly></textarea>
    <button onclick="copyOutput()">コピー</button>
  </div>
</div>

<div id="messageBox" class="message-box"></div>

<script>
// CoC7版の技能初期値
const initialValues7e = {
  '目星': 25, '聞き耳': 20, '図書館': 20, '近接戦闘': 25, '投擲': 20,
  '射撃：拳銃': 20, '射撃：サブマシンガン': 15, '射撃：重火器': 10, '射撃：マシンガン': 10, '射撃：ライフル': 25,
  '射撃：ショットガン': 25, '射撃：弓': 15, '応急手当': 30, '鍵開け': 1, '手さばき': 10,
  '隠密': 20, '精神分析': 1, '追跡': 10, '登攀': 20, '鑑定': 5,
  '運転': 20, '機械修理': 10, '重機械操作': 1, '乗馬': 5, '水泳': 20,
  '製作': 5, '操縦': 1, '跳躍': 20, '電気修理': 10, 'ナビゲート': 10,
  '変装': 5, 'ダイビング': 1, '言いくるめ': 5, '説得': 10, '威圧': 15,
  '魅惑': 15, '言語': 1, '医学': 1, 'オカルト': 5, '芸術': 5,
  '経理': 5, '考古学': 1, 'コンピューター': 5, '科学': 1, '心理学': 10,
  '人類学': 1, '電子工学': 1, '自然': 10, '法律': 5, '歴史': 5,
  'サバイバル': 10, '伝承': 1, '回避': 42,
  '幸運': 0
};

// メッセージボックスを表示する関数
function showMessageBox(message, isError = false) {
    const messageBox = document.getElementById('messageBox');
    messageBox.textContent = message;
    messageBox.className = 'message-box show'; // showクラスを追加
    if (isError) {
        messageBox.style.backgroundColor = '#dc3545'; // エラー時は赤
    } else {
        messageBox.style.backgroundColor = '#28a745'; // 成功時は緑
    }

    setTimeout(() => {
        messageBox.classList.remove('show'); // showクラスを削除して非表示
    }, 2000); // 2秒後に消える
}

// 無視する行を正規表現で定義
const ignoredLinePatterns = [
    /^1d100<=\{SAN\}\s+【正気度ロール】$/,
    /^CC<=\s*([0-9]+|\{STR\})\s+【STR】$/,
    /^CC<=\s*([0-9]+|\{CON\})\s+【CON】$/,
    /^CC<=\s*([0-9]+|\{POW\})\s+【POW】$/,
    /^CC<=\s*([0-9]+|\{DEX\})\s+【DEX】$/,
    /^CC<=\s*([0-9]+|\{APP\})\s+【APP】$/,
    /^CC<=\s*([0-9]+|\{SIZ\})\s+【SIZ】$/,
    /^CC<=\s*([0-9]+|\{INT\})\s+【INT】$/,
    /^CC<=\s*([0-9]+|\{EDU\})\s+【EDU】$/
];


function formatPalette() {
  const lines = document.getElementById("input").value.split("\n");
  const categories = {
    dice: [],
    explore: [],
    combat: [],
    action: [],
    interpersonal: [],
    knowledge: [],
    initial: [],
    status: [],
    damage: []
  };
  const presentSkills = new Map();

  lines.forEach(line => {
    const trimmedLine = line.trim();
    if (!trimmedLine) return;

    // 無視する行の正規表現と照合
    const shouldIgnore = ignoredLinePatterns.some(pattern => pattern.test(trimmedLine));
    if (shouldIgnore) return;

    // ダメージ判定を最優先で処理
    // 1d6+1D4のような形式も認識できるように正規表現を修正
    if (trimmedLine.match(/1d\d+\+\S+\s+【ダメージ判定】/i)) {
      categories.damage.push(trimmedLine);
      return;
    }

    // 能力値を次に処理
    const statusMatch = trimmedLine.match(/^(STR|CON|POW|DEX|APP|SIZ|INT|EDU|HP|MP)\s*[:：]?\s*(\d+)/i);
    if (statusMatch && !trimmedLine.includes("× 5")) {
      categories.status.push(`CC<=${statusMatch[2]} 【${statusMatch[1].toUpperCase()}】`);
      return;
    }
    
    // 技能判定のパターンを検出してスキル名と値を抽出
    const skillMatch = trimmedLine.match(/(CCB|CC)<=([0-9]+)\s+【(.+?)】/);
    if (skillMatch) {
        const [, , value, skillFull] = skillMatch;
        const skill = skillFull.replace(/（.*?）|\(.*?\)/g, '').trim();
        presentSkills.set(skill, value);

        if (["幸運", "アイデア", "知識", "正気度ロール"].includes(skill)) {
            categories.dice.push(trimmedLine);
        } else if (["回避", "近接戦闘", "砲"].includes(skill)) {
            categories.combat.push(trimmedLine);
        } else if (["医学", "オカルト", "芸術", "経理", "考古学", "コンピューター", "科学", "心理学", "人類学", "電子工学", "自然", "法律", "歴史", "サバイバル", "伝承"].includes(skill) ||
                   /^芸術/.test(skillFull)) {
            categories.knowledge.push(trimmedLine);
        } else if (["言いくるめ", "説得", "威圧", "魅惑", "信用"].includes(skill) || /^言語/.test(skillFull)) {
            categories.interpersonal.push(trimmedLine);
        } else if (["目星", "聞き耳", "図書館"].includes(skill)) {
            categories.explore.push(trimmedLine);
        } else if (["投擲", "射撃：拳銃", "射撃：サブマシンガン", "射撃：重火器", "射撃：マシンガン", "射撃：ライフル", "射撃：ショットガン", "射撃：弓"].includes(skill) ||
                   /^射撃/.test(skillFull)) {
            categories.combat.push(trimmedLine);
        } else if (["鍵開け", "手さばき", "隠密", "追跡", "登攀", "ナビゲート", "鑑定", "ダイビング","応急手当", "運転", "機械修理", "重機械操作", "乗馬", "水泳", "製作", "操縦", "跳躍", "電気修理", "変装", "精神分析"].includes(skill) ||
                   /^(運転|製作|操縦|工芸)/.test(skillFull)) {
            categories.action.push(trimmedLine);
        } else {
            categories.knowledge.push(trimmedLine);
        }
    } else {
        // SAN、正気度ロールなど、技能判定の形式ではないがダイスとして扱いたい行
        if (trimmedLine.includes("SAN") || trimmedLine.includes("正気度ロール") || trimmedLine.includes("幸運") || trimmedLine.includes("アイデア") || trimmedLine.includes("知識")) {
            categories.dice.push(trimmedLine);
        } else {
            // どのパターンにも合致しない場合は知識技能へ
            categories.knowledge.push(trimmedLine);
        }
    }
  });

  // ◼️ダイス の順序を調整
  const sortedDice = [];
  const sanRollLine = `1d100<={SAN} 【正気度ロール】`;
  const ideaLine = categories.dice.find(line => line.includes("アイデア"));
  const knowledgeLine = categories.dice.find(line => line.includes("知識"));
  const luckLine = `CC<={幸運} 【幸運】`;
  
  sortedDice.push(sanRollLine);
  if (ideaLine) sortedDice.push(ideaLine);
  if (knowledgeLine) sortedDice.push(knowledgeLine);
  sortedDice.push(luckLine);

  const otherDice = categories.dice.filter(line => !sortedDice.some(sortedLine => sortedLine === line));
  sortedDice.push(...otherDice);
  categories.dice = sortedDice;

  // 🟥戦闘技能 の順序を調整
  const sortedCombat = [];
  const evadeValue = presentSkills.get('回避') || initialValues7e['回避'];
  const evadeLine = `CC<=${evadeValue} 【回避】`;
  let meleeLine = categories.combat.find(line => line.includes("近接戦闘"));
  const cannonLine = categories.combat.find(line => line.includes("砲"));
  
  if (!meleeLine) {
    const meleeValue = presentSkills.get('近接戦闘') || initialValues7e['近接戦闘'] || 25;
    meleeLine = `CC<=${meleeValue} 【近接戦闘】`;
    presentSkills.set('近接戦闘', meleeValue);
  }
  
  sortedCombat.push(evadeLine);
  if (meleeLine) sortedCombat.push(meleeLine);
  if (cannonLine) sortedCombat.push(cannonLine);

  const otherCombat = categories.combat.filter(line => !sortedCombat.includes(line));
  sortedCombat.push(...otherCombat);
  categories.combat = sortedCombat;

  // 🟦探索技能 の順序を調整
  const sortedExplore = [];
  const meboshiLine = `CC<=${presentSkills.get('目星') || initialValues7e['目星'] || 0} 【目星】`;
  const kikimimiLine = `CC<=${presentSkills.get('聞き耳') || initialValues7e['聞き耳'] || 0} 【聞き耳】`;
  const toshokanLine = `CC<=${presentSkills.get('図書館') || initialValues7e['図書館'] || 0} 【図書館】`;

  if (meboshiLine) sortedExplore.push(meboshiLine);
  if (kikimimiLine) sortedExplore.push(kikimimiLine);
  if (toshokanLine) sortedExplore.push(toshokanLine);
  
  const otherExplore = categories.explore.filter(line => !sortedExplore.some(sortedLine => sortedLine === line));
  sortedExplore.push(...otherExplore);
  categories.explore = sortedExplore;

  // 初期値技能の追加
  const missingInitials = Object.entries(initialValues7e)
    .filter(([skill, _]) => !presentSkills.has(skill) && skill !== '幸運' && skill !== '近接戦闘' && skill !== '目星' && skill !== '聞き耳' && skill !== '図書館' && skill !== '回避')
    .map(([skill, value]) => `CC<=${value} 【${skill}】`);

  // 固定の能力値リスト
  const fixedStatus = [
    `CC<={STR} 【STR】`,
    `CC<={CON} 【CON】`,
    `CC<={POW} 【POW】`,
    `CC<={DEX} 【DEX】`,
    `CC<={APP} 【APP】`,
    `CC<={SIZ} 【SIZ】`,
    `CC<={INT} 【INT】`,
    `CC<={EDU} 【EDU}`
  ];

  // 出力順序と見出しをCoC7版に合わせて調整
  const output = [
    "◼️ダイス", ...categories.dice,
    "\n🟦探索技能", ...categories.explore,
    "\n🟥戦闘技能", ...categories.combat,
    "\n🟧行動技能", ...categories.action,
    "\n🟪対人技能", ...categories.interpersonal,
    "\n⬜️知識技能", ...categories.knowledge,
    "\n========初期値========", ...missingInitials,
    "\n========能力値========", ...fixedStatus, ...categories.damage,
    "\n=====パラメータ化=====",
    ...["アイデア", "知識", "目星", "聞き耳", "図書館"].map(skill => {
        const value = presentSkills.get(skill) || initialValues7e[skill] || 0;
        return `//${skill} = ${value}`;
    })
  ].join("\n");

  document.getElementById("output").value = output;
}

function copyOutput() {
  const output = document.getElementById("output");
  if (!output.value) {
    showMessageBox("コピーする内容がありません。", true);
    return;
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(output.value).then(() => {
      showMessageBox("コピーしました！");
    }).catch(err => {
      console.error('コピーに失敗しました (navigator.clipboard): ', err);
      tryCopyToClipboardFallback(output.value);
    });
  } else {
    tryCopyToClipboardFallback(output.value);
  }
}

function tryCopyToClipboardFallback(text) {
    const tempTextArea = document.createElement('textarea');
    tempTextArea.value = text;
    tempTextArea.style.position = 'fixed';
    tempTextArea.style.left = '-9999px';
    tempTextArea.style.top = '-9999px';
    document.body.appendChild(tempTextArea);
    tempTextArea.focus();
    tempTextArea.select();
    try {
        document.execCommand('copy');
        showMessageBox("コピーしました！");
    } catch (err) {
        console.error('コピーに失敗しました (document.execCommand): ', err);
        showMessageBox("コピーに失敗しました。", true);
    } finally {
        document.body.removeChild(tempTextArea);
    }
}
</script>

</body>
</html>
