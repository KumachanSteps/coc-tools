<!DOCTYPE html>
<html lang="ja">

<script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- レスポンシブ対応を追加 -->
<title>CoC6版キャラシート整形ツールV2</title>
<!-- Interフォントの読み込み -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

<!-- ここまでファビコンの設定 -->
  
<style>
body {
  font-family: 'Inter', sans-serif; /* Interフォントを使用 */
  margin: 0;
  background-color: #f0f4f8; /* ライトブルー系の背景色 */
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh; /* 画面いっぱいに広がるように */
  padding: 20px;
}
header {
  margin-bottom: 30px;
  text-align: center;
  padding: 20px;
  background-color: #ffffff;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
  width: 100%;
  max-width: 1000px;
}
header h1 {
  font-size: 2.5rem; /* 大きめのフォントサイズ */
  color: #2c3e50; /* ダークブルー */
  margin-bottom: 10px;
}
header p {
  font-size: 1rem;
  color: #555;
  line-height: 1.6;
}
.main {
  display: flex;
  flex-direction: column; /* スマートフォンでは縦並び */
  gap: 30px;
  max-width: 1000px;
  width: 100%;
}
@media (min-width: 768px) { /* デスクトップでは横並び */
  .main {
    flex-direction: row;
  }
}
.container {
  flex: 1;
  display: flex;
  flex-direction: column;
  background-color: #ffffff;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
}
textarea {
  width: 100%;
  height: 450px; /* 高さを調整 */
  resize: vertical; /* 縦方向のみリサイズ可能 */
  padding: 15px;
  font-family: 'Inter', monospace;
  font-size: 0.95rem;
  background-color: #f9f9f9;
  border: 1px solid #e0e0e0;
  border-radius: 8px;
  box-sizing: border-box;
  color: #333;
  line-height: 1.5;
  transition: border-color 0.3s ease-in-out;
}
textarea:focus {
  outline: none;
  border-color: #4a90e2; /* フォーカス時のボーダー色 */
  box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.2);
}
button {
  margin-top: 20px;
  padding: 12px 25px;
  font-size: 1.1rem;
  cursor: pointer;
  border: none;
  border-radius: 8px;
  background-color: #4a90e2; /* ブルー系のボタン色 */
  color: #fff;
  transition: background-color 0.3s ease-in-out, transform 0.2s ease-in-out;
  font-weight: 600;
  box-shadow: 0 4px 10px rgba(74, 144, 226, 0.3);
}
button:hover {
  background-color: #357ABD;
  transform: translateY(-2px);
  box-shadow: 0 6px 15px rgba(74, 144, 226, 0.4);
}
button:active {
  transform: translateY(0);
  box-shadow: 2px 5px rgba(74, 144, 226, 0.3);
}

/* メッセージボックスのスタイル */
.message-box {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background-color: #333;
    color: #fff;
    padding: 15px 30px;
    border-radius: 8px;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    z-index: 1000;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease-in-out, visibility 0.3s ease-in-out;
    font-weight: bold;
}
.message-box.show {
    opacity: 1;
    visibility: visible;
}

/* フッターのスタイル */
footer {
    margin-top: 40px;
    width: 100%;
    max-width: 1000px;
    text-align: center;
    font-size: 0.75rem; /* 小さなフォントサイズ */
    color: #777;
    line-height: 1.4;
    padding: 10px 0;
}

/* モバイル向けにボタンの幅を調整 */
@media (max-width: 767px) {
  button {
    width: 100%;
  }
}
</style>
</head>
<body>

<header>
  <h1>CoC6版 チャットパレット整形ツール</h1>
  <p>このツールは、CoC6版探索者のチャットパレットを自動分類し、初期値技能も加えた形でスッキリと整理します。<br>入力欄にチャットパレットを貼り付け、「分類して出力」ボタンで整形結果を表示します。</p>
</header>

<div class="main">
  <div class="container">
    <textarea id="input" placeholder="ここにチャットパレットを貼り付けてください（例：CCB<=70 【目星】）"></textarea>
    <button onclick="formatPalette()">分類して出力</button>
  </div>

  <div class="container">
    <!-- 手動編集可能 -->
    <textarea id="output" placeholder="整形結果がここに表示されます"></textarea>
    <button onclick="copyOutput()">コピー</button>
  </div>
</div>

<div id="messageBox" class="message-box"></div>

<footer>
  Last Update: 19Oct2025<br>
  当ツールは「Chaosium Inc.」「株式会社アークライト」「株式会社KADOKAWA」が<br>
  権利を有する『クトゥルフ神話TRPG』の二次創作物です。<br>
  ©Chaosium Inc.／アークライト／KADOKAWA
</footer>

<script>
const initialValues = {
  'キック': 25, '組み付き': 25, '頭突き': 10, '投擲': 25, 'マーシャルアーツ': 1,
  '拳銃': 20, 'サブマシンガン': 15, 'ショットガン': 30, 'マシンガン': 15, 'ライフル': 25,
  '応急手当': 30, '鍵開け': 1, '隠す': 15, '隠れる': 10, '忍び歩き': 10, '写真術': 10, '精神分析': 1,
  '追跡': 10, '登攀': 40, '運転': 20, '機械修理': 20, '重機械操作': 1, '乗馬': 5, '水泳': 25,
  '製作': 5, '操縦': 1, '跳躍': 25, '電気修理': 10, 'ナビゲート': 10, '変装': 1,
  '言いくるめ': 5, '信用': 15, '説得': 15, '値切り': 5,
  '医学': 5, 'オカルト': 5, '化学': 1, '芸術': 5, '経理': 10, '考古学': 1, 'コンピューター': 1,
  '心理学': 5, '人類学': 1, '生物学': 1, '地質学': 1, '電子工学': 1, '天文学': 1, '博物学': 10, '物理学': 1, '法律': 5, '薬学': 1, '歴史': 20
};

// カスタムメッセージボックスを表示する関数 (alertの代替)
function showMessage(message, isError = false) {
  const box = document.getElementById("messageBox");
  box.textContent = message;
  // エラーの場合は赤系の背景色を設定
  box.style.backgroundColor = isError ? '#cc0000' : '#333';
  box.classList.add('show');
  setTimeout(() => {
    box.classList.remove('show');
  }, 2000); // 2秒後に非表示にする
}


function formatPalette() {
  const lines = document.getElementById("input").value.split("\n");
  // categories.status は使用せず、固定の8行で置き換えるため、空のままにする
  const categories = { dice: [], explore: [], battle: [], action: [], talk: [], knowledge: [], initial: [], damage: [] };
  const presentSkills = new Map();

  lines.forEach(line => {
    // SANは dice に分類して終了
    if (line.includes("SAN")) {
      categories.dice.push(line);
      return;
    }
  
    // ダメージ判定は先に分類して終了
    if (line.match(/ダメージ判定/)) {
      categories.damage.push(line);
      return;
    }
    
    // その他の技能判定
    const match = line.match(/CCB<=([0-9]+)\s+【(.+?)】/);
    if (!match) return;
  
    const [, value, skillFull] = match;
    const skill = skillFull.replace(/（.*?）/, '').replace(/\(.*?\) /, ''); // 括弧内の情報も除去
  
    // presentSkills に登録
    presentSkills.set(skill, value);

    // 「アイデア」「幸運」「知識」は dice に分類して終了
    if (["アイデア", "幸運", "知識"].includes(skill)) {
      categories.dice.push(line);
      return;
    }
    
    // それ以外を分類
    if (["目星", "聞き耳", "図書館"].includes(skill)) {
      categories.explore.push(line);
    } 
    // 交渉技能の分類ルールを更新: 外国語/他の言語/母国語をtalkに分類
    else if (["言いくるめ", "信用", "説得", "値切り"].includes(skill) || /^(母国語|外国語|他の言語)(（.*?）|\(.*?\))?/.test(skillFull)) {
      categories.talk.push(line);
    } 
    // ★戦闘技能の分類リストを更新
    else if (["回避", "こぶし", "キック", "組み付き", "頭突き", "投擲", "マーシャルアーツ", "拳銃", "サブマシンガン", "ショットガン", "マシンガン", "ライフル", "ソード", "日本刀", "ナイフ", "肉切り包丁", "チェーンソー", "槍", "三節棍", "ムチ", "サーベル", "木斧", "手斧", "レイピア", "フェンシング・フォイル", "タクティカル・バトン", "警棒", "仕込み杖", "太刀", "薙刀", "弓", "クロスボウ", "競技用アーチェリー"].some(s => skill.includes(s)) || /^(小さな棍棒|大きな棍棒|小さい棍棒|大きい棍棒)/.test(skillFull)) {
      categories.battle.push(line);
    } else if (["応急手当", "鍵開け", "隠す", "隠れる", "忍び歩き", "写真術", "精神分析", "追跡", "登攀", "運転", "機械修理", "重機械操作", "乗馬", "水泳", "製作", "操縦", "跳躍", "電気修理", "ナビゲート", "変装"].some(s => skill.includes(s)) || /^(運転|製作|操縦)/.test(skillFull)) {
      categories.action.push(line);
    } else {
      categories.knowledge.push(line);
    }

  });

  // 母国語（EDUx2）を初期値として交渉技能セクションに追加 (チャットパレットに存在しない場合のみ)
  if (!presentSkills.has('母国語')) {
      categories.talk.push('CCB<={EDU}*2 【母国語（*自由記入）】 ');
  }

  // 初期値技能の生成
  const missingInitials = Object.entries(initialValues)
    .filter(([skill, _]) => !presentSkills.has(skill))
    .map(([skill, value]) => `CCB<=${value} 【${skill}】`);

  // 8コア能力値の代数リストを生成 (固定リスト)
  const coreAbilityChecks = [
    `CCB<={STR}*5 【STR × 5】`,
    `CCB<={CON}*5 【CON × 5】`,
    `CCB<={POW}*5 【POW × 5】`,
    `CCB<={DEX}*5 【DEX × 5】`,
    `CCB<={APP}*5 【APP × 5】`,
    `CCB<={SIZ}*5 【SIZ × 5】`,
    `CCB<={INT}*5 【INT × 5】`,
    `CCB<={EDU}*5 【EDU × 5】`,
  ];

  const output = [
    "◼️ダイス", ...categories.dice,
    "\n🟦探索技能", ...categories.explore,
    "\n🟥戦闘技能", ...categories.battle,
    "\n🟧行動技能・他", ...categories.action,
    "\n🟪交渉技能", ...categories.talk,
    "\n⬜️知識技能", ...categories.knowledge,
    "\n========初期値========", ...missingInitials,
    "\n========能力値========", 
    ...categories.damage, // 入力からのダメージ計算式
    ...coreAbilityChecks, // 固定の8コア能力値
    "\n=====パラメータ化=====",
    ...["アイデア", "幸運", "知識", "目星", "聞き耳", "図書館","回避"].map(skill => `//${skill} = ${presentSkills.get(skill) || initialValues[skill] || 0}`)
  ].join("\n");

  document.getElementById("output").value = output;
}

function copyOutput() {
  const output = document.getElementById("output");
  // alert() の代わりに showMessage() を使用します
  navigator.clipboard.writeText(output.value).then(() => {
    showMessage("📋 コピーしました！"); 
    gtag('event', 'copy_output', {
      'event_category': 'button',
      'event_label': 'コピー',
      'value': 1
    });
  }).catch(err => {
    // エラー時も showMessage() を使用し、エラーフラグを渡します
    showMessage("❌ コピーに失敗しました: ブラウザの制限を確認してください", true);
  });
}
</script>

</body>
</html>
