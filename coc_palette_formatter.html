<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,follow" />
  <title>CoCチャパレ整形ツールv2へ移動します</title>
  <link rel="canonical" href="https://kumachansteps.github.io/trpg-web-tools/tools/chat-palette-formatter/" />
  <link rel="icon" href="./kuma_icon.ico" type="image/x-icon" />

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-NJD5JZML31"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "G-NJD5JZML31");
  </script>

  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #07101f;
      color: #f7fbff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 20%, rgba(76, 201, 240, .18), transparent 34rem),
        radial-gradient(circle at 80% 80%, rgba(114, 86, 255, .18), transparent 32rem),
        #07101f;
    }

    main {
      width: min(620px, 100%);
      padding: clamp(28px, 6vw, 48px);
      border: 1px solid rgba(142, 220, 255, .28);
      border-radius: 24px;
      background: rgba(10, 24, 46, .88);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .35);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: #8edcff;
      font-weight: 700;
      letter-spacing: .08em;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 5vw, 2.6rem);
      line-height: 1.35;
    }

    p {
      margin: 20px auto 0;
      color: #cbd8ea;
      line-height: 1.8;
    }

    a {
      display: inline-flex;
      margin-top: 28px;
      padding: 14px 22px;
      border-radius: 999px;
      background: linear-gradient(135deg, #4cc9f0, #806bff);
      color: #07101f;
      font-weight: 800;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 4px;
    }

    .note { font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">新バージョン公開中</p>
    <h1>CoCチャパレ整形ツールv2へ移動します</h1>
    <p>
      CoC 6版・7版の自動判定や、複数サービスのデータ形式に対応した
      新しい整形ツールへ自動的に移動します。
    </p>
    <a id="destinationLink" href="https://kumachansteps.github.io/trpg-web-tools/tools/chat-palette-formatter/">
      今すぐv2を開く
    </a>
    <p class="note">移動しない場合は、上のボタンを押してください。</p>
  </main>

  <script>
    (() => {
      const destination = "https://kumachansteps.github.io/trpg-web-tools/tools/chat-palette-formatter/";
      let redirected = false;

      const redirect = () => {
        if (redirected) return;
        redirected = true;
        window.location.replace(destination);
      };

      window.setTimeout(redirect, 1200);

      if (typeof window.gtag === "function") {
        window.gtag("event", "legacy_tool_redirect", {
          legacy_tool: "coc6_chat_palette_formatter",
          destination_tool: "chat-palette-formatter",
          transport_type: "beacon",
          event_callback: redirect
        });
      }
    })();
  </script>
</body>
</html>
