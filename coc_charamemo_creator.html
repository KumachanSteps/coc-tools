<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>いあきゃらテキスト変換器</title>

<footer>
  Last Update: 19Oct2025<br>

<script src="https://cdn.tailwindcss.com"></script>
<style>
    body { background-color: #121212; color: #e0e0e0; font-family: sans-serif; }
    .glass-card { 
        background-color: #1e1e1e; 
        border: 1px solid #333;
        box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .btn-primary {
        background: linear-gradient(135deg, #059669 0%, #10b981 100%);
        transition: all 0.2s;
    }
    .btn-secondary {
        background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        transition: all 0.2s;
    }
    .btn-primary:hover:not(:disabled), .btn-secondary:hover:not(:disabled) {
        filter: brightness(1.1);
        transform: translateY(-1px);
    }
    textarea {
        scrollbar-width: thin;
        scrollbar-color: #444 #1e1e1e;
    }
    .checkbox-label {
        @apply flex items-center space-x-2 text-xs cursor-pointer p-1 rounded hover:bg-zinc-700 transition;
    }
</style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center min-h-screen">
<div class="glass-card w-full max-w-2xl p-6 md:p-8 rounded-2xl">
    <header class="mb-8 text-center">
        <h1 class="text-2xl font-bold text-white mb-2">iachara Text to CCFOLIA</h1>
        <p class="text-gray-400 text-sm">テキスト出力全文をココフォリア駒データに変換します</p>
    </header>

    <!-- 入力エリア -->
    <section class="mb-6">
        <label class="block text-sm font-semibold text-emerald-400 mb-2">1. いあきゃらのテキスト全文を貼り付け</label>
        <textarea id="rawTextInput" 
            class="w-full h-48 bg-zinc-900 text-xs p-4 rounded-xl border border-zinc-700 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-none leading-relaxed" 
            placeholder="【基本情報】から始まるテキストをすべて貼り付けてください..."></textarea>
    </section>

    <!-- ステップ2 見出し -->
    <label class="block w-full text-sm font-semibold text-emerald-400 mb-2">2. キャラメモorキャラ駒の生成オプションを選んで出力</label>

    <!-- 設定 -->
    <section class="mb-8 grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="p-4 bg-zinc-800/50 rounded-xl border border-zinc-700">
            <span class="block text-sm font-bold mb-3 text-emerald-400">表示オプション</span>
            <div class="grid grid-cols-2 gap-x-2 gap-y-1 mb-4">
                <label class="checkbox-label">
                    <input type="checkbox" id="opt-summary" checked class="rounded text-emerald-500 bg-zinc-700">
                    <span>基本情報</span>
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="opt-memo-ref" class="rounded text-emerald-500 bg-zinc-700">
                    <span>メモ参照</span>
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="opt-battle" checked class="rounded text-emerald-500 bg-zinc-700">
                    <span>武器・防具</span>
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="opt-items" checked class="rounded text-emerald-500 bg-zinc-700">
                    <span>所持品</span>
                </label>
            </div>

            <div class="border-t border-zinc-700 my-3 pt-3">
                <span class="block text-[10px] font-bold mb-2 text-zinc-400 uppercase tracking-wider">キャラ駒生成オプション</span>
                <div class="grid grid-cols-1 gap-y-1">
                    <label class="checkbox-label">
                        <input type="checkbox" id="opt-luck-consume" class="rounded text-emerald-500 bg-zinc-700">
                        <span>幸運消費ルール</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="opt-ammo-status" class="rounded text-emerald-500 bg-zinc-700">
                        <span>装弾数追加</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="opt-commands" class="rounded text-emerald-500 bg-zinc-700">
                        <span>コマンドを追加</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="opt-palette" checked class="rounded text-emerald-500 bg-zinc-700">
                        <span>チャットパレット</span>
                    </label>
                </div>
            </div>
        </div>
        <div class="flex flex-col justify-center space-y-3">
            <button id="convertBtn" class="btn-primary text-white font-bold py-3 px-4 rounded-xl shadow-lg text-sm">
                駒データを生成してコピー
            </button>
            <button id="memoOnlyBtn" class="btn-secondary text-white font-bold py-3 px-4 rounded-xl shadow-lg text-sm">
                キャラメモのみをコピー
            </button>
            <p id="statusMsg" class="text-center text-xs h-4"></p>
        </div>
    </section>

    <!-- フォールバック用エリア -->
    <div id="fallbackArea" class="hidden mt-4">
        <p class="text-red-400 text-xs mb-2 text-center font-bold">自動コピー失敗。以下をコピーしてください：</p>
        <textarea id="outputJson" readonly class="w-full h-32 bg-zinc-800 text-[10px] p-2 rounded border border-zinc-600 outline-none"></textarea>
    </div>

    <footer class="mt-8 pt-4 border-t border-zinc-800 text-center text-[10px] text-zinc-500">
        クトゥルフ神話TRPG 6版テキスト形式に対応
    </footer>
</div>

<script>
    const convertBtn = document.getElementById('convertBtn');
    const memoOnlyBtn = document.getElementById('memoOnlyBtn');
    const rawTextInput = document.getElementById('rawTextInput');
    const statusMsg = document.getElementById('statusMsg');
    const fallbackArea = document.getElementById('fallbackArea');
    const outputJson = document.getElementById('outputJson');

    const optSummary = document.getElementById('opt-summary');
    const optMemoRef = document.getElementById('opt-memo-ref');

    optSummary.addEventListener('change', () => { if(optSummary.checked) optMemoRef.checked = false; });
    optMemoRef.addEventListener('change', () => { if(optMemoRef.checked) optSummary.checked = false; });

    function extractField(text, label) {
        const reg = new RegExp(`${label}:\\s*([^\\/\\n\\r]+)`, "m");
        const m = text.match(reg);
        return m ? m[1].trim() : "";
    }

    function formatWeapons(rawText) {
        const lines = rawText.split('\n');
        const result = [];
        lines.forEach(line => {
            const trimmed = line.trim();
            if (!trimmed || trimmed.startsWith('名称') || trimmed.startsWith('名前')) return;

            const parts = trimmed.split(/\s{2,}|\t+/);
            if (parts.length >= 3) {
                const [name, rate, dmg, range, count, ammo, dur, other] = parts;
                let block = `武器名：${name}\n`;
                block += `成功率${rate || '-'} ¦ ダメージ${dmg || '-'} ¦ 射程${range || '-'} ¦ \n`;
                block += `回数${count || '-'} ¦ 装弾数${ammo || '-'} ¦ 耐久力${dur || '-'} ¦ 故障${other || '-'}`;
                if (parts.length > 8) {
                    block += `\nその他：${parts.slice(8).join(' ')}`;
                }
                result.push(block);
            }
        });
        return result.join('\n\n');
    }

    function formatItems(rawText) {
        const lines = rawText.split('\n');
        const result = [];
        lines.forEach(line => {
            const trimmed = line.trim();
            if (!trimmed || trimmed.startsWith('名称') || trimmed.includes('所持金:') || trimmed.includes('借金:')) return;

            const parts = trimmed.split(/\s{2,}|\t+/);
            if (parts.length > 0) {
                const name = parts[0];
                let effect = "";
                for(let i = 1; i < parts.length; i++) {
                    if (!/^\d+(?:[a-zA-Z]+)?$/.test(parts[i])) {
                        effect = parts.slice(i).join(' ');
                        break;
                    }
                }
                result.push(effect ? `${name}：${effect}` : name);
            }
        });
        return result.join('\n');
    }

    function parseIacharaText(text) {
        const data = {
            name: "",
            memo: "",
            color: "#888888",
            status: [],
            params: [],
            commands: "",
            initiative: 0
        };

        data.name = extractField(text, "名前");

        const colorMatch = text.match(/からコード:\s*(#[0-9a-fA-F]{6})/);
        if (colorMatch) data.color = colorMatch[1];

        const dbMatch = text.match(/ダメージボーナス\s+([+-]?[\d\w+]+)/);
        const dbValue = dbMatch ? dbMatch[1] : "0";

        const statsToExtract = ["STR", "CON", "POW", "DEX", "APP", "SIZ", "INT", "EDU", "HP", "MP", "SAN", "幸運"];
        statsToExtract.forEach(s => {
            const reg = new RegExp(`^${s}\\s+(\\d+)\\s+(\\d+)`, "m");
            const m = text.match(reg);
            if (m) {
                const val = parseInt(m[1]);
                const max = parseInt(m[2]);
                if (s === "DEX") data.initiative = val;
                if (["HP", "MP", "SAN"].includes(s)) {
                    data.status.push({ label: s, value: val, max: max });
                } else if (s === "幸運" && document.getElementById('opt-luck-consume').checked) {
                    data.status.push({ label: s, value: val, max: max });
                } else {
                    data.params.push({ label: s, value: val.toString() });
                }
            }
        });

        data.params.push({ label: "DB", value: dbValue });

        // 能力値計算（重複回避用）
        const intParam = data.params.find(p => p.label === "INT");
        const eduParam = data.params.find(p => p.label === "EDU");
        const ideaVal = intParam ? parseInt(intParam.value) * 5 : 0;
        const knowledgeVal = eduParam ? parseInt(eduParam.value) * 5 : 0;

        let paletteLines = [
            "CC<={SAN} 【正気度ロール】",
            `CCB<=${ideaVal} 【アイデア】`,
            "CCB<={幸運} 【幸運】",
            `CCB<=${knowledgeVal} 【知識】`
        ];

        // 技能抽出（アイデア・知識・幸運・ステータス名と被るものを除外）
        const excludeFromSkills = [...statsToExtract, "アイデア", "知識", "IDE", "技能名"];
        const skillLines = [...text.matchAll(/^([^\s\d『』]+)\s+(\d+)\s+\d+/gm)];
        for (const m of skillLines) {
            const skillName = m[1].trim();
            const skillValue = m[2];
            if (skillName && !excludeFromSkills.includes(skillName)) {
                paletteLines.push(`CCB<=${skillValue} 【${skillName}】`);
            }
        }

        // ダメージ判定
        paletteLines.push("1d3+0 【ダメージ判定】");
        paletteLines.push("1d4+0 【ダメージ判定】");
        paletteLines.push("1d6+0 【ダメージ判定】");

        // 能力値×5
        const coreParams = ["STR", "CON", "POW", "DEX", "APP", "SIZ", "INT", "EDU"];
        coreParams.forEach(p => {
            paletteLines.push(`CCB<={${p}}*5 【${p} × 5】`);
        });

        let memoParts = [];
        
        if (document.getElementById('opt-summary').checked) {
            const name = extractField(text, "名前");
            const job = extractField(text, "職業");
            const age = extractField(text, "年齢");
            const gender = extractField(text, "性別");
            const height = extractField(text, "身長");
            const weight = extractField(text, "体重");

            let summaryLines = [];
            if (name) summaryLines.push(`名前: ${name}`);
            if (job) summaryLines.push(`職業: ${job}`);
            if (age || gender) summaryLines.push(`年齢: ${age} / 性別: ${gender}`);
            if (height || weight) summaryLines.push(`身長: ${height} / 体重: ${weight}`);
            if (summaryLines.length > 0) memoParts.push(summaryLines.join('\n'));
        }
        
        if (document.getElementById('opt-memo-ref').checked) {
            const memoSection = text.match(/【メモ】([\s\S]+?)(?=\n【|$)/);
            if (memoSection) memoParts.push(memoSection[1].trim());
        }

        const battleSection = text.match(/【戦闘・武器・防具】([\s\S]+?)(?=\n【|$)/);
        const foundAmmoWeapons = [];

        if (battleSection && battleSection[1].trim()) {
            const battleRaw = battleSection[1].trim();
            
            if (document.getElementById('opt-battle').checked) {
                memoParts.push("\n【武器・防具】\n" + formatWeapons(battleRaw));
            }

            if (document.getElementById('opt-ammo-status').checked || document.getElementById('opt-commands').checked) {
                const lines = battleRaw.split('\n');
                lines.forEach(line => {
                    const trimmed = line.trim();
                    if (!trimmed || trimmed.startsWith('名称') || trimmed.startsWith('名前')) return;
                    const parts = trimmed.split(/\s{2,}|\t+/);
                    if (parts.length >= 6) {
                        const name = parts[0];
                        const ammo = parts[5];
                        const ammoNum = ammo.match(/\d+/);
                        if (ammoNum) {
                            const val = parseInt(ammoNum[0]);
                            const statusName = `装弾数(${name})`;
                            foundAmmoWeapons.push({ name: name, statusName: statusName, value: val });
                            if (document.getElementById('opt-ammo-status').checked) {
                                data.status.push({ label: statusName, value: val, max: val });
                            }
                        }
                    }
                });
            }
        }

        // 操作用コマンドの追加
        if (document.getElementById('opt-commands').checked) {
            paletteLines.push(""); 
            paletteLines.push(":HP-");
            paletteLines.push(":SAN-");
            foundAmmoWeapons.forEach(w => {
                paletteLines.push(`:${w.statusName}-`);
            });
        }

        data.commands = paletteLines.join('\n');

        if (document.getElementById('opt-items').checked) {
            const itemSection = text.match(/【所持品】([\s\S]+?)(?=\n【|$)/);
            if (itemSection && itemSection[1].trim()) {
                memoParts.push("\n【所持品】\n" + formatItems(itemSection[1].trim()));
            }
        }

        data.memo = memoParts.join('\n').trim();
        return data;
    }

    async function copyToClipboard(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            try {
                await navigator.clipboard.writeText(text);
                return true;
            } catch (err) {}
        }
        try {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            const successful = document.execCommand('copy');
            document.body.removeChild(textArea);
            return successful;
        } catch (err) {
            return false;
        }
    }

    function showMessage(msg, isError = false) {
        statusMsg.innerText = msg;
        statusMsg.className = `text-center text-xs mt-2 font-bold ${isError ? 'text-red-400' : 'text-emerald-400'}`;
        setTimeout(() => { statusMsg.innerText = ""; }, 3000);
    }

    convertBtn.onclick = async () => {
        const text = rawTextInput.value.trim();
        if (!text) return showMessage("テキストを入力してください", true);

        fallbackArea.classList.add('hidden');
        try {
            const parsed = parseIacharaText(text);
            const ccfoliaData = {
                kind: "character",
                data: {
                    name: parsed.name,
                    memo: parsed.memo,
                    initiative: parsed.initiative,
                    color: parsed.color,
                    commands: document.getElementById('opt-palette').checked ? parsed.commands : "",
                    status: parsed.status,
                    params: parsed.params,
                }
            };
            const jsonStr = JSON.stringify(ccfoliaData);
            const success = await copyToClipboard(jsonStr);
            if (success) {
                showMessage("駒データをコピーしました！");
            } else {
                showMessage("自動コピー失敗。下の枠からコピーしてください", true);
                outputJson.value = jsonStr;
                fallbackArea.classList.remove('hidden');
            }
        } catch (err) {
            showMessage("解析エラーが発生しました", true);
        }
    };

    memoOnlyBtn.onclick = async () => {
        const text = rawTextInput.value.trim();
        if (!text) return showMessage("テキストを入力してください", true);
        try {
            const parsed = parseIacharaText(text);
            const success = await copyToClipboard(parsed.memo);
            if (success) showMessage("キャラメモをコピーしました！");
            else showMessage("コピーに失敗しました", true);
        } catch (err) {
            showMessage("解析エラーが発生しました", true);
        }
    };
</script>
</body>
