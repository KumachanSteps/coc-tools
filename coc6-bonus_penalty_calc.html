<title>CoC6版：ボーナス/ペナルティダイス補正計算ツール</title>

  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonus/Penalty Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700&family=Shippori+Mincho:wght@400;700&display=swap');
        
        :root {
            --coc-red: #9a0000;
            --coc-dark-red: #660000;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #121212;
            color: #d1d1d1;
            line-height: 1.6;
        }

        .mincho { font-family: 'Shippori Mincho', serif; }

        .card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .input-style {
            background-color: #0f0f0f;
            border: 1px solid #444;
            color: #fff;
            transition: all 0.3s ease;
        }

        .input-style:focus {
            border-color: var(--coc-red);
            outline: none;
            box-shadow: 0 0 8px rgba(154, 0, 0, 0.4);
        }

        .result-gradient {
            background: linear-gradient(145deg, #252525 0%, #151515 100%);
            border-left: 5px solid var(--coc-red);
        }

        .delta-positive { color: #52ea8c; }
        .delta-negative { color: #ff5f5f; }

        .rights-footer {
            font-size: 0.7rem;
            line-height: 1.5;
            color: #666;
            margin-top: 2rem;
            text-align: center;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-results {
            animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
  

<!-- アップロードされたアイコンファイルを指定しました。 -->
<!-- このHTMLファイルと同じディレクトリに「kuma_icon.ico」を配置してください -->
<link rel="icon" href="kuma_icon.ico" type="image/x-icon">
<!-- ここまでファビコンの設定 -->
  
<body class="min-h-screen flex flex-col items-center justify-center p-6">

    <div class="card w-full max-w-md rounded-2xl p-8 mb-4">
        <header class="mb-10 border-b border-zinc-800 pb-6 text-center">
            <h1 class="mincho text-3xl font-bold text-white mb-2 tracking-tight">Bonus/Penalty Calculator</h1>
            <p class="text-zinc-500 text-sm italic font-light">"一瞬でフェアな補正値を計算"</p>
        </header>

        <div class="space-y-8">
            <!-- Input: Skill Level -->
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider mb-2 text-zinc-400">元の成功率 (%)</label>
                <div class="relative">
                    <input type="number" id="skillInput" 
                           class="input-style w-full px-5 py-4 rounded-xl text-2xl font-bold" 
                           placeholder="30" min="1" max="99"
                           oninput="processLogic()">
                    <span class="absolute right-5 top-1/2 -translate-y-1/2 text-zinc-600 font-bold text-lg">%</span>
                </div>
            </div>

            <!-- Input: Dice Choice -->
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider mb-2 text-zinc-400">ボーナス/ペナルティ選択 (7版形式)</label>
                <div class="relative">
                    <select id="diceChoice" 
                            class="input-style w-full px-5 py-4 rounded-xl appearance-none cursor-pointer pr-10"
                            onchange="processLogic()">
                        <option value="1">ボーナスダイス 1個 (CC1)</option>
                        <option value="2">ボーナスダイス 2個 (CC2)</option>
                        <option value="-1">ペナルティダイス 1個 (CC-1)</option>
                        <option value="-2">ペナルティダイス 2個 (CC-2)</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-zinc-500">
                        <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.707 6.586 4.293 8z"/></svg>
                    </div>
                </div>
            </div>

            <!-- Output Display -->
            <div id="resultArea" class="hidden">
                <div class="result-gradient p-6 rounded-xl space-y-5 animate-results">
                    <div class="flex justify-between items-center border-b border-white/5 pb-3">
                        <span class="text-xs font-bold tracking-widest text-zinc-500 uppercase">7版期待成功率</span>
                        <span id="rateOutput" class="text-xl font-bold text-white">--</span>
                    </div>

                    <div class="flex justify-between items-center border-b border-white/5 pb-3">
                        <span class="text-xs font-bold tracking-widest text-zinc-500 uppercase">期待値の差 (デルタ)</span>
                        <span id="deltaOutput" class="text-xl font-bold">--</span>
                    </div>

                    <div class="pt-2 text-center">
                        <span class="block text-xs font-bold tracking-widest text-zinc-500 uppercase mb-3">推奨される補正値 (6版向け)</span>
                        <div id="suggestedBox" class="text-4xl font-black py-3 px-8 rounded-xl inline-block shadow-inner">
                            --
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Empty State Helper -->
            <div id="placeholder" class="text-center py-6 text-zinc-600 text-sm italic">
                基準となる成功値を入力！
            </div>
        </div>

        <div class="mt-10 pt-4 border-t border-zinc-800 text-center text-xs text-zinc-500 font-medium">
            ”この補正で切り抜けろ”
        </div>
    </div>

    <!-- Rights Footer -->
    <footer class="rights-footer max-w-md">
        Last Update: 19Mar2026<br>
        当ツールは「Chaosium Inc.」「株式会社アークライト」「株式会社KADOKAWA」が<br>
        権利を有する『クトゥルフ神話TRPG』の二次創作物です。<br>
        ©Chaosium Inc.／アークライト／KADOKAWA
    </footer>

    <script>
        function processLogic() {
            const skillElement = document.getElementById('skillInput');
            const diceElement = document.getElementById('diceChoice');
            const resultArea = document.getElementById('resultArea');
            const placeholder = document.getElementById('placeholder');
            
            const S = parseFloat(skillElement.value);
            const type = parseInt(diceElement.value);

            if (isNaN(S) || S <= 0 || S > 110) { // Allowing slightly over 100 for special cases
                resultArea.classList.add('hidden');
                placeholder.classList.remove('hidden');
                return;
            }

            resultArea.classList.remove('hidden');
            placeholder.classList.add('hidden');

            const P = S / 100;
            let adjustedRate;

            // Mathematical calculation based on verified logic
            if (type === 1) {
                adjustedRate = (1 - Math.pow(1 - P, 2)) * 100;
            } else if (type === 2) {
                adjustedRate = (1 - Math.pow(1 - P, 3)) * 100;
            } else if (type === -1) {
                adjustedRate = Math.pow(P, 2) * 100;
            } else if (type === -2) {
                adjustedRate = Math.pow(P, 3) * 100;
            }

            const rawDelta = adjustedRate - S;
            
            // Rounding to nearest 5
            const suggestedAdj = Math.round(rawDelta / 5) * 5;
            const sign = suggestedAdj > 0 ? "+" : "";

            // UI Update
            document.getElementById('rateOutput').innerText = adjustedRate.toFixed(2) + "%";
            
            const deltaElem = document.getElementById('deltaOutput');
            deltaElem.innerText = (rawDelta > 0 ? "+" : "") + rawDelta.toFixed(2) + "%";
            deltaElem.className = rawDelta >= 0 ? 'text-xl font-bold delta-positive' : 'text-xl font-bold delta-negative';

            const suggestBox = document.getElementById('suggestedBox');
            suggestBox.innerText = sign + suggestedAdj + "%";
            
            if (suggestedAdj > 0) {
                suggestBox.style.color = '#52ea8c';
                suggestBox.style.backgroundColor = 'rgba(82, 234, 140, 0.1)';
            } else if (suggestedAdj < 0) {
                suggestBox.style.color = '#ff5f5f';
                suggestBox.style.backgroundColor = 'rgba(255, 95, 95, 0.1)';
            } else {
                suggestBox.style.color = '#fff';
                suggestBox.style.backgroundColor = 'rgba(255, 255, 255, 0.05)';
            }
        }
    </script>
</body>
</html>
