<header class="site-header">
  <div class="header-inner">
    <div class="header-top-row">
      <a
        class="portal-link"
        href="https://kumachansteps.github.io/coc-tools/trpg-web-tools/index.html"
        data-i18n="nav.backToTools"
      >
        ← TRPG Web Tools
        <span class="portal-tooltip">Return to TRPG Web Tools Portal</span>
      </a>

      <span class="header-pill header-pill-cyan" data-i18n="tag.diceLogInput">
        ダイスログインプット
      </span>

      <span class="header-pill header-pill-violet" data-i18n="tag.coc67">
        CoC 6版 / 7版
      </span>

      <span class="header-pill header-pill-amber" data-i18n="tag.growthCheckerLink">
        成長チェッカーと連携
      </span>
    </div>

    <div class="header-main-row">
      <div class="header-title-area">
        <div class="title-row">
          <div class="tool-icon dice-tool-icon" aria-hidden="true">
            <svg class="tool-icon-dice" viewBox="0 0 64 64" role="img">
              <rect x="13" y="13" width="38" height="38" rx="10" ry="10" fill="currentColor"/>
              <circle cx="24" cy="24" r="3.4" fill="#020617"/>
              <circle cx="40" cy="24" r="3.4" fill="#020617"/>
              <circle cx="32" cy="32" r="3.4" fill="#020617"/>
              <circle cx="24" cy="40" r="3.4" fill="#020617"/>
              <circle cx="40" cy="40" r="3.4" fill="#020617"/>
            </svg>

            <span class="tool-icon-star">✦</span>

            <span class="tool-icon-stats" aria-hidden="true">
              <span class="tool-icon-stat-bar tool-icon-stat-bar-1"></span>
              <span class="tool-icon-stat-bar tool-icon-stat-bar-2"></span>
              <span class="tool-icon-stat-bar tool-icon-stat-bar-3"></span>
            </span>
          </div>

          <h1 class="site-title" data-i18n="app.title">Dice Stat Analyst</h1>
        </div>

        <p class="site-description" data-i18n="app.description">
          セッションログHTML / テキストからd100ロールを抽出し、キャラクター別にクリティカル・ファンブル率、10刻み分布を生成します。
        </p>

        <p class="shortcut-tip" data-i18n-html="app.tip">
          Tip: <kbd>Ctrl/Cmd</kbd> + <kbd>Enter</kbd> で分析 ｜ 
          <kbd>Ctrl/Cmd</kbd> + <kbd>Shift</kbd> + <kbd>V</kbd> でスクショ表示 ｜ 
          <kbd>?</kbd> でショートカット一覧
        </p>
      </div>

      <div class="header-actions">
        <div class="header-mini-actions">
          <button id="languageToggleBtn" class="language-toggle-button" type="button" aria-label="英語表示に切替">
            EN
          </button>

          <button
            id="shortcutHelpBtn"
            class="shortcut-help-button"
            type="button"
            aria-label="ショートカット一覧を開く"
            data-i18n="button.shortcuts"
          >
            ⌨ Shortcuts
          </button>
        </div>
      </div>
    </div>
  </div>
</header>
