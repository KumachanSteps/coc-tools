<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-NJD5JZML31"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "G-NJD5JZML31");
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>TRPG Web Tools</title>
  <meta
    name="description"
    content="TRPGセッション準備・ログ解析・卓報告作成・シナリオ情報整理を補助するためのWebツール集です。"
  />

  <link rel="icon" href="./shared/assets/kuma_icon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="./assets/css/portal.css" />
</head>

<body class="dawn">
  <div class="background-space" aria-hidden="true">
    <div class="stars"></div>
    <div class="nebula nebula-a"></div>
    <div class="nebula nebula-b"></div>
    <div class="nebula nebula-c"></div>
    <div class="orbit-line"></div>
  </div>

  <main class="page">
    <header class="topbar">
      <div class="brand-row">
        <div class="brand-mark" aria-hidden="true">✦</div>

        <div>
          <p class="eyebrow">TRPG SESSION SUPPORT TOOLS</p>
          <p class="topbar-subtitle">Starlit Portal / Tool Observatory</p>
        </div>
      </div>

    <button id="modeToggle" class="mode-button" type="button" aria-label="Switch to deep space mode">
      <span id="modeIcon" aria-hidden="true">☾</span>
      <span id="modeText">Deep Space</span>
    </button>
    </header>

    <section class="hero-grid">
      <div class="hero-copy">
        <div class="hero-label">
          <span aria-hidden="true">✧</span>
          自作TRPG Webツール集
        </div>

        <h1>
          TRPG <span class="title-accent">Web</span> Tools
        </h1>

        <p class="lead">
          TRPGセッション準備・ログ解析・卓報告作成・シナリオ情報整理を補助するためのポータルページです。
          星図のように並んだツール群から、使用したいツールを選択してください。
        </p>
      </div>

      <aside class="status-summary" aria-label="Tool status summary">
        <div class="summary-grid">
          <div class="summary-item">
            <p id="availableCount" class="summary-number">0</p>
            <p class="summary-label">Available</p>
          </div>

          <div class="summary-item">
            <p id="productionCount" class="summary-number">0</p>
            <p class="summary-label">Production</p>
          </div>

          <div class="summary-item">
            <p id="ideaCount" class="summary-number">0</p>
            <p class="summary-label">Idea</p>
          </div>
        </div>
      </aside>
    </section>

    <section class="filter-panel" aria-label="Tool filters">
      <div class="filter-row">
        <div class="search-box">
          <span class="search-mark" aria-hidden="true">⌕</span>
          <input
            id="searchInput"
            class="search-input"
            type="search"
            placeholder="Search tools..."
            aria-label="Search tools"
            autocomplete="off"
          />
        </div>

        <div id="categoryButtons" class="category-buttons" aria-label="Tool categories">
          <button class="category-button is-active" type="button" data-category="All" aria-pressed="true">All</button>
          <button class="category-button" type="button" data-category="Log Analysis" aria-pressed="false">Log Analysis</button>
          <button class="category-button" type="button" data-category="Report Writing" aria-pressed="false">Report Writing</button>
          <button class="category-button" type="button" data-category="Scenario Prep" aria-pressed="false">Scenario Prep</button>
          <button class="category-button" type="button" data-category="Character Utility" aria-pressed="false">Character Utility</button>
          <button class="category-button" type="button" data-category="Haishin Tracking" aria-pressed="false">Haishin Tracking</button>
          <button class="category-button" type="button" data-category="GM Support" aria-pressed="false">GM Support</button>
        </div>
      </div>
    </section>

    <section id="toolsGrid" class="tools-grid" aria-label="Tool list"></section>

    <footer>
      <p>© TRPG Web Tools / Created for TRPG Session Support</p>
    </footer>
  </main>

  <script src="./assets/js/portal.js"></script>
</body>
</html>
