<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シナリオPDFテキスト抽出＆編集ツール</title>
    <style>
        /* 基本的なスタイル */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            /* Canvas内で表示されるため、bodyの高さを明示的に設定 */
            height: 100vh; 
            overflow: hidden;
        }

        header {
            background-color: #333;
            color: white;
            padding: 10px 20px;
            text-align: center;
        }

        .container {
            display: flex;
            /* ヘッダーの高さを引く */
            height: calc(100vh - 50px); 
        }

        /* 左側のエリア (25%) */
        .left-panel {
            width: 25%;
            padding: 20px;
            box-sizing: border-box;
            background-color: #fff;
            border-right: 1px solid #ccc;
            display: flex;
            flex-direction: column;
            overflow-y: auto; /* コンテンツがはみ出た場合にスクロール */
        }

        /* 右側のエリア (75%) */
        .right-panel {
            width: 75%;
            padding: 20px;
            box-sizing: border-box;
            background-color: #f9f9f9;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* 各セクションのスタイル */
        .section {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #fff;
        }

        h2 {
            margin-top: 0;
            border-bottom: 2px solid #ccc;
            padding-bottom: 5px;
            font-size: 1.1em;
            color: #333;
        }

        /* 1. PDFファイルを読み込む */
        .pdf-upload-section {
            flex-grow: 0;
        }

        .drop-zone {
            border: 2px dashed #007bff;
            padding: 20px;
            text-align: center;
            color: #666;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .pdf-process-btn {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
        }

        .pdf-process-btn:hover {
            background-color: #0056b3;
        }

        /* 2. シンボル装飾 */
        .symbol-decoration-section {
            flex-grow: 1; /* 残りのスペースを使用 */
        }

        .symbol-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .symbol-btn {
            padding: 8px 12px;
            font-size: 1.2em;
            background-color: #e9ecef;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
        }

        .symbol-btn:hover {
            background-color: #ddd;
        }

        /* 3. 編集エリア */
        .edit-area-section {
            height: 80%; /* 右側エリアの80% */
            display: flex;
            flex-direction: column;
        }

        #editor {
            flex-grow: 1;
            width: 100%;
            border: 1px solid #ccc;
            padding: 10px;
            font-size: 1em;
            resize: none;
            box-sizing: border-box;
            margin-top: 10px;
        }

        /* 4. 最終テキストをコピー */
        .copy-text-section {
            height: 20%; /* 右側エリアの20% */
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 15px;
        }

        .copy-btn {
            padding: 15px 30px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1.2em;
        }

        .copy-btn:hover {
            background-color: #1e7e34;
        }
    </style>
</head>
<body>

    <header>
        <h1>シナリオPDFテキスト抽出＆編集ツール</h1>
    </header>

    <div class="container">
        <div class="left-panel">
            
            <div class="section pdf-upload-section">
                <h2>1. PDFファイルを読み込む</h2>
                <div class="drop-zone" id="pdfDropZone">
                    PDFファイルをここにドラッグ＆ドロップ
                    <input type="file" id="pdfFile" accept="application/pdf" style="display: none;">
                </div>
                <button class="pdf-process-btn">PDFを処理</button>
            </div>

            <div class="section symbol-decoration-section">
                <h2>2. シンボル装飾</h2>
                <p>シンボルをクリックすると、エディターのカーソル位置に直接挿入されます。</p>
                <div class="symbol-grid">
                    <button class="symbol-btn" data-symbol="★">★</button>
                    <button class="symbol-btn" data-symbol="☆">☆</button>
                    <button class="symbol-btn" data-symbol="■">■</button>
                    <button class="symbol-btn" data-symbol="◇">◇</button>
                    <button class="symbol-btn" data-symbol="⇒">⇒</button>
                    <button class="symbol-btn" data-symbol="…">…</button>
                    <button class="symbol-btn" data-symbol="【">【</button>
                    <button class="symbol-btn" data-symbol="】">】</button>
                </div>
            </div>
        </div>

        <div class="right-panel">
            
            <div class="section edit-area-section">
                <h2>3. 編集エリア</h2>
                <p>PDFをアップロードし、「PDFを処理」をクリックすると、抽出されたテキストがここに表示されます。</p>
                <textarea id="editor" placeholder="抽出されたテキストがここに表示されます..." aria-label="編集エリア"></textarea>
            </div>

            <div class="copy-text-section">
                <button class="copy-btn">最終テキストをクリップボードにコピー</button>
            </div>
        </div>
    </div>

</body>
</html>
